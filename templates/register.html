{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Create Customer Account</h1>
    <p class="muted">Register before applying for a loan.</p>

    <form id="registerForm">
        <label>Full Name</label>
        <input id="name" type="text" required minlength="2" placeholder="Manoj Reddy">

        <label>Email</label>
        <input id="email" type="email" required placeholder="manoj@example.com">

        <label>Mobile Number</label>
        <input id="mobile" type="text" required maxlength="10" placeholder="9876543210">

        <label>Password</label>
        <input id="password" type="password" required minlength="6" placeholder="Minimum 6 characters">

        <button class="btn primary full" type="submit">Register</button>
    </form>

    <p class="auth-footer">
        Already registered?
        <a href="/login">Login</a>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("registerForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const response = await fetch("/api/auth/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            mobile: document.getElementById("mobile").value,
            password: document.getElementById("password").value
        })
    });

    const data = await response.json();

    if (!response.ok) {
        showToast(data.detail || "Registration failed", "error");
        return;
    }

    showToast("Registration successful. Redirecting to login...", "success");

    setTimeout(() => {
        window.location.href = "/login";
    }, 1000);
});
</script>
{% endblock %}
